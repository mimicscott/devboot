# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  assertions:
    # Require minimum OS version
    - directives:
        allowPrerelease: true
        description: Verify min OS version requirement
      resource: Microsoft.Windows.Developer/OsVersion
      settings:
        MinVersion: '10.0.22000'
  configurationVersion: 0.2.0
  resources:
    # Enable Developer Mode
    - directives:
        allowPrerelease: true
        description: Enable Developer Mode
      resource: Microsoft.Windows.Developer/DeveloperMode
      settings:
        Ensure: Present
    # 7-Zip
    - directives:
        allowPrerelease: false
        description: Install 7-Zip
      id: 7Zip
      resource: Microsoft.WinGet.DSC/WinGetPackage
      settings:
        id: "7zip.7zip"
        source: winget
    # Command Line
    - directives:
        allowPrerelease: false
        description: Install PowerShell
      id: PowerShell
      resource: Microsoft.WinGet.DSC/WinGetPackage
      settings:
        id: Microsoft.PowerShell
        source: winget
    # WSL
    - directives:
        allowPrerelease: false
        description: Install Windows Subsystem for Linux
      id: WSL
      resource: Microsoft.WinGet.DSC/WinGetPackage
      settings:
        id: "9P9TQF7MRM4R"
        source: msstore
    # WSL Ubuntu 22.04
    - dependsOn:
        - WSL
      directives:
        allowPrerelease: false
        description: Install Ubuntu WSL2
      id: UbuntuWSL2
      resource: Microsoft.WinGet.DSC/WinGetPackage
      settings:
        id: Canonical.Ubuntu.2204
        source: winget
    # Git
    - directives:
        allowPrerelease: true
        description: Install Git
      id: Git
      resource: Microsoft.WinGet.DSC/WinGetPackage
      settings:
        id: Git.Git
        source: winget
    # GitHub Cli
    - directives:
        allowPrerelease: true
        description: Install GitHub Cli
      id: GitHubCli
      resource: Microsoft.WinGet.DSC/WinGetPackage
      settings:
        id: GitHub.cli
        source: winget
    - directives:
        allowPrerelease: true
        description: Install GitHub Desktop
      id: GitHubDesktop
      resource: Microsoft.WinGet.DSC/WinGetPackage
      settings:
        id: GitHub.GitHubDesktop
        source: winget
    - directives:
        allowPrerelease: false
        description: Install Visual Studio Code
      id: VSCode
      resource: Microsoft.WinGet.DSC/WinGetPackage
      settings:
        id: Microsoft.VisualStudioCode
        source: winget
    - directives:
        allowPrerelease: true
        description: Install Visual Studio 2022 Professional
      id: VisualStudio
      resource: Microsoft.WinGet.DSC/WinGetPackage
      settings:
        id: Microsoft.VisualStudio.2022.Professional
        source: winget
    - dependsOn:
        - VisualStudio
      directives:
        allowPrerelease: true
        description: Install required VS workloads from vsconfig file
      resource: Microsoft.VisualStudio.DSC/VSComponents
      settings:
        channelId: VisualStudio.17.Release
        includeRecommended: true
        productId: Microsoft.VisualStudio.Product.Professional
        vsConfigFile: '${WinGetConfigRoot}\.vsconfig'
    - directives:
        allowPrerelease: true
        description: Install DevTunnel
      id: DevTunnel
      resource: Microsoft.WinGet.DSC/WinGetPackage
      settings:
        id: Microsoft.devtunnel
        source: winget
